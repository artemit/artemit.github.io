<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% if page.title %}{{ page.title }} | {{site.title}}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">

    <link rel="icon" type="image/x-icon" href="{{ "/assets/img/icons/favicon.ico" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/vendor/pure-min.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/vendor/grids-responsive-min.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/default.css" | relative_url }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
</head>
